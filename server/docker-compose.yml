version: '3.8'

services:
  iron-paradise-backend:
    build: .
    container_name: iron-paradise-crm-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=iron_paradise_gym_super_secure_key_2026
      - DATA_DIR=/app/data
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
